name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs these through deploy.yml
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover tests

      - name: Golden set eval
        run: python tests/golden/run_eval.py
